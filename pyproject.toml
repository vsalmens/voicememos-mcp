[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicememos-mcp"
version = "0.6.6"
description = "MCP server for Apple Voice Memos with transcription that marks uncertain words"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "requests>=2.31",
]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
voiceprint = ["sherpa-onnx>=1.10", "numpy>=1.24"]
test = ["pytest>=8", "numpy>=1.24"]

[project.scripts]
voicememos-mcp = "voicememos_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voicememos_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
